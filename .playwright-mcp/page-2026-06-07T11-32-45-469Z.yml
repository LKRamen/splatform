    - heading "Capture Mode — Gaussian Splat Instructions" [level=1] [ref=e4]
    - generic [ref=e5]: Follow these steps to film Fordham Lincoln Center for tomorrow's live splat integration.
  - generic [ref=e6]:
    - heading "What to Capture" [level=2] [ref=e7]
    - list [ref=e8]:
      - listitem [ref=e9]:
        - paragraph [ref=e10]: Film the main ground-floor lobby and plaza of Fordham Lincoln Center — the spaces the robot will traverse. Aim for a ~20×20 m capture zone.
      - listitem [ref=e11]:
        - paragraph [ref=e12]: "Walk in slow, overlapping arcs. Never walk backwards. Keep the phone held at chest height and pointed slightly downward (15–20°). Speed: about 0.3 m/s (very slow)."
      - listitem [ref=e13]:
        - paragraph [ref=e14]: "Cover the scene from three distinct heights: ground-level (0.5 m), chest-level (1.2 m), and overhead (2 m, phone raised). 2–3 loops at each height."
      - listitem [ref=e15]:
        - paragraph [ref=e16]: Avoid fast pans, motion blur, or direct sunlight reflections on glass. Shoot in overcast light or interior lighting — consistent exposure is key.
      - listitem [ref=e17]:
        - paragraph [ref=e18]: Capture close-up detail passes for any furniture, pillars, or landmarks the robot will navigate around — 1 m distance, slow 360° orbit.
    - generic [ref=e19]: "Minimum frames: 300–500 photos for a room-scale capture. Postshot will auto-extract from video — film at least 4 minutes of continuous footage."
